<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle shield outline -->
  <path d="M256 64 C350 64 416 110 416 192 C416 320 256 430 256 448 C256 430 96 320 96 192 C96 110 162 64 256 64 Z" 
        fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />

  <!-- Sparkle top right -->
  <path d="M370 120 L378 138 L396 146 L378 154 L370 172 L362 154 L344 146 L362 138 Z" fill="#38bdf8" />

  <!-- Letter R (Bold Academic Styling) -->
  <text x="256" y="325" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="240" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#glow)">R</text>

  <!-- Pulse underline -->
  <path d="M180 370 L220 370 L235 345 L255 395 L275 355 L290 370 L332 370" 
        fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
